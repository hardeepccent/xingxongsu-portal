<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Publisher Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">

    <div id="loginSection" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold tracking-tight text-white">XingXongSu Portal</h2>
            <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest">Global Analytics & Tracking</p>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-xs uppercase font-medium text-slate-400 mb-1">Email or Phone</label>
                <input type="text" id="loginId" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 text-sm" placeholder="Enter identifier">
            </div>
            <div>
                <label class="block text-xs uppercase font-medium text-slate-400 mb-1">Password</label>
                <input type="password" id="password" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 text-sm" placeholder="••••••••">
            </div>
            <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl transition text-sm shadow-lg shadow-blue-500/20">Secure Login</button>
        </div>
    </div>

    <div id="dashboardSection" class="hidden max-w-4xl w-full mx-auto">
        <div class="flex justify-between items-center mb-8 bg-slate-900 border border-slate-800 p-6 rounded-2xl">
            <div>
                <h1 class="text-xl font-bold">Welcome Partner</h1>
                <p class="text-xs text-blue-400 mt-0.5">ID: <span id="pubIdDisplay"></span></p>
            </div>
            <button onclick="logout()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 px-4 py-2 rounded-xl text-xs font-medium transition">Sign Out</button>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl mb-8 flex gap-4 items-center">
            <div class="w-1/2">
                <label class="block text-xs uppercase text-slate-400 mb-1 font-medium">Performance Date</label>
                <input type="date" id="dateSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white text-sm">
            </div>
            <div class="w-1/2 flex items-end">
                <button onclick="fetchStats()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-2 rounded-xl transition text-sm w-full shadow-lg shadow-blue-500/20">Fetch Metrics</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                <p class="text-slate-400 text-xs uppercase tracking-wider font-medium">Total Clicks</p>
                <h3 id="totalClicks" class="text-3xl font-extrabold mt-2 text-blue-400">0</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                <p class="text-slate-400 text-xs uppercase tracking-wider font-medium">Unique Clicks</p>
                <h3 id="uniqueClicks" class="text-3xl font-extrabold mt-2 text-emerald-400">0</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                <p class="text-slate-400 text-xs uppercase tracking-wider font-medium">Conversions</p>
                <h3 id="conversions" class="text-3xl font-extrabold mt-2 text-amber-400">0</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                <p class="text-slate-400 text-xs uppercase tracking-wider font-medium">Conversion Rate</p>
                <h3 id="crRate" class="text-3xl font-extrabold mt-2 text-purple-400">0%</h3>
            </div>
        </div>
    </div>

    <script>
        let currentUserData = {};

        async function handleLogin() {
            const loginId = document.getElementById('loginId').value;
            const password = document.getElementById('password').value;
            const date = document.getElementById('dateSelect')?.value || new Date().toISOString().split('T')[0];

            if (!loginId || !password) {
                alert('Please fill in login details');
                return;
            }

            const res = await fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ loginId, password, date_from: date, date_to: date })
            });
            const result = await res.json();

            if (result.success) {
                currentUserData = { loginId, password };
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                document.getElementById('pubIdDisplay').innerText = result.sub_id;
                
                document.getElementById('totalClicks').innerText = result.data.clicks || 0;
                document.getElementById('uniqueClicks').innerText = result.data.unique_clicks || 0;
                document.getElementById('conversions').innerText = result.data.conversions || 0;
                document.getElementById('crRate').innerText = (result.data.cr || 0) + '%';
            } else {
                alert('Authentication Failed');
            }
        }

        async function fetchStats() {
            const date = document.getElementById('dateSelect').value;
            const res = await fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ loginId: currentUserData.loginId, password: currentUserData.password, date_from: date, date_to: date })
            });
            const result = await res.json();
            if (result.success) {
                document.getElementById('totalClicks').innerText = result.data.clicks || 0;
                document.getElementById('uniqueClicks').innerText = result.data.unique_clicks || 0;
                document.getElementById('conversions').innerText = result.data.conversions || 0;
                document.getElementById('crRate').innerText = (result.data.cr || 0) + '%';
            }
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
